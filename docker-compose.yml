services:
  backend:
    build: ./backend
    container_name: experiencehub-backend
    env_file: .env
    environment:
      JWT_SECRET: ${JWT_SECRET:-experiencehub-dev-secret-key-change-in-production-min-256-bits-long!!}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: experiencehub-frontend
    environment:
      NGINX_ENVSUBST_FILTER: BACKEND_URL
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: experiencehub-elasticsearch
    profiles: ["elk"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: experiencehub-kibana
    profiles: ["elk"]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  elasticsearch_data:
