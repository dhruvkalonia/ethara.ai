spring:
  application:
    name: experiencehub
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/experiencehub}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:experiencehub-dev-secret-key-change-in-production-min-256-bits-long!!}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    com.experiencehub: INFO
    org.springframework.security: WARN
  file:
    name: logs/application.log
